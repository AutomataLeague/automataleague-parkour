[project]
name = "automataleague-parkour"
version = "0.1.0"
description = "A league of robots competing at athletic tasks (parkour, boxing, sumo, ...) in MuJoCo, trained with TorchRL."
readme = "README.md"
requires-python = ">=3.10"

# Core (Phase A: scene building + rendering). Kept light so local setup is fast.
dependencies = [
    "mujoco>=3.4.0",
    "numpy>=1.24",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# Training stack (Phase B) — install on the GPU box: `uv sync --extra train`
train = [
    "torch>=2.4",
    "torchrl>=0.6",
    "tensordict>=0.6",
    "hydra-core>=1.3",
    "wandb>=0.18",
    "tqdm>=4.66",
    "moviepy>=1.0",   # required by wandb.Video for eval video logging
]
# GPU-parallel physics (Phase B) — MuJoCo Warp. Source pinned per-machine on the GPU box.
gpu = [
    "mujoco-warp",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["automataleague_parkour"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA device + mujoco-warp (run on the spark/jetson)",
]
