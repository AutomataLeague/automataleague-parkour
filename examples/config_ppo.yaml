# PPO training for parkour with GPU-parallel MuJoCo-Warp environments
env:
  name: parkour-1
  robot: spot
  num_envs: 2048           # lower it if you run out of memory, raise it on a bigger GPU
  max_episode_steps: null  # null => per-level budget from the registry (flat 2000,
                           # obstacles 3000). A lap is ~1465 steps, so a shorter cap
                           # truncates every episode before the finish.
  seed: 42
  frame_skip: 10           # ~50 Hz control

  course:
    track: circuit     # override with env.course.track=l_curved
    length: 9.0
    half_width: 1.6
    level_difficulty: 0   # Stage-1 obstacles: 0=flat, 1..4 harder
    height_scan: true     # 12-point forward terrain scan (obs +12); on so the policy can see
                          # obstacles at levels 1..4. Harmless at level 0 (flat ground).
    randomize_obstacles: true    # per-episode obstacle scaling ~ U(dr_low,dr_high) around the
                                 # level's nominal height. An implicit within-level curriculum:
                                 # some episodes land easier, which is how the policy gets a
                                 # first success to learn from. Eval forces it off (factor 1.0),
                                 # so scores are always on the nominal course.
    dr_low: 0.5
    dr_high: 1.5
    # action range: q_target = home + action_scale*action. null => robot default (0.3).
    # Max foot lift by scale: 0.3->0.15m, 0.5->0.28m, 0.7->0.40m, 0.79->0.45m.
    # Raise with the level so the foot can clear the taller obstacles:
    #   L1: 0.30 | L2: 0.50 | L3: 0.70 | L4: ~0.79
    action_scale: null
    # race mode: navigate by along-track speed + gate-crossing (no forced dip to gate
    # centres) so the agent finds the time-optimal line. Pair with the RACE reward
    # preset below and warm-start from a solved obstacle policy. Override:
    #   env.course.race_mode=true env.reward_weights.progress=0 env.reward_weights.checkpoint=0 \
    #   env.reward_weights.alive=-0.03 env.reward_weights.target_speed=2.5 env.reward_weights.forward=2.0
    race_mode: false
    # track perception: append K lookahead points ahead of the agent so it can plan a
    # line through the corridor. Off for the completion task (reach the finish); racing
    # turns it on, see examples/config_race.yaml. One knob:
    #   none                 disabled (blind to the track ahead)
    #   boundary             K left+right corridor-edge points -> perceives the channel
    #   centerline           K midline points -> tracks the middle
    track_perception: boundary
    preview_distances: [1.5, 3.0, 4.5, 6.0]   # arc-length metres ahead (used when on)

  # Forward-velocity is the dense locomotion driver (makes moving beat standing);
  # progress adds goal shaping; success/checkpoint are the big goal bonuses.
  reward_weights:
    forward: 1.5         # reward base speed toward the goal (up to target_speed)
    target_speed: 1.0    # m/s; forward reward saturates here
    progress: 2.0
    checkpoint: 10.0
    success: 100.0
    alive: 0.0
    upright: 0.05        # small posture shaping (low, so standing isn't a local optimum)
    height: 0.05
    action: 0.01
    joint_vel: 0.001
    fall: 10.0
    off_path: 25.0       # off-track = terminate + strong penalty (stay on the path)
    feet_air_time: 0.0        # foot air-time gait reward (Warp env); 0=off. Rewards clean stepping.
    feet_air_time_target: 0.25   # target swing time per step (s)

  termination:
    fall_height: 0.25
    max_tilt_deg: 60.0
    off_path: true

# collector
collector:
  total_frames: 10_000_000
  frames_per_batch: 65536   # num_envs * steps_per_env
  device: cuda

# PPO loss hyperparameters
loss:
  clip_epsilon: 0.2
  entropy_coeff: 0.01     # higher exploration to escape the standing local optimum
  critic_coeff: 0.5
  loss_critic_type: l2
  ppo_epochs: 5
  mini_batch_size: 8192
  gamma: 0.99
  gae_lambda: 0.95
  max_grad_norm: 1.0
  anneal_lr: true
  anneal_clip_epsilon: true

# optim
optim:
  lr: 3.0e-4
  device: cuda

# network
network:
  hidden_sizes: [512, 256, 128]
  activation: elu
  device: cuda
  init_checkpoint: null   # path to warm-start from (e.g. flat-circuit policy -> obstacles)

# Explicit checkpoint/run name. null => the entry point's default (e.g. race_L0).
# Set it to keep several runs of the same config apart, e.g. seed sweeps:
#   uv run python examples/ppo_race.py env.seed=1 run_name=race_L0_s1
run_name: null

# logging
logger:
  backend: wandb
  project_name: automataleague-parkour
  group_name: null
  exp_name: ${env.name}_PPO
  mode: online
  eval_iter: 1_000_000   # eval + video every 1M frames
  video: true
  video_steps: 4000      # eval-video upper bound; clip ends early at episode done
  # Render an mp4 from each stage's best checkpoint when that stage finishes, to
  # videos/<run_name>.mp4. The curriculum therefore leaves one clip per level, so a
  # level that trained badly is visible without waiting for the whole chain.
  stage_video: true
  stage_video_camera: chase     # chase | drone_side | drone | top | side | front | over_shoulder
  stage_video_steps: 2500
  log_outcome_breakdown: true

# Curriculum (consumed by ppo_curriculum.py; ppo_single.py ignores it).
# Trains each level in turn, warm-starting from the previous level's best policy.
curriculum:
  levels: [1, 2, 3, 4]
  frames_per_level: [10_000_000, 10_000_000, 10_000_000, 20_000_000]
  action_scale_per_level: [0.30, 0.70, 0.70, 0.79]   # L1..L4; matches the runs that cleared them
  warm_start: true          # carry weights level -> level
  eval_per_level: true
